events {}

http {
    server {
        listen 80;

        # 1. ADDON ROUTES
        # This matches /manifest.json, /catalog/..., /stream/..., etc.
        location ~* ^/(manifest\.json|catalog/|meta/|detail/|stream/) {
            proxy_pass http://addon:7000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. APP ROUTES (Everything else)
        # Any URL that doesn't match the list above goes to the Surf-TG App
        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}