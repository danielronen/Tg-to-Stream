services:
  app:
    build: .
    restart: on-failure
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - UPSTREAM_REPO=          # Setting this to empty stops the code overwrite
      - UPSTREAM_BRANCH=  

  addon:
    build: .
    restart: on-failure
    volumes:
      - .:/app
    command: python test.py

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app
      - addon